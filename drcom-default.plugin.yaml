id: drcom-default
name: DrCOM 默认校园网认证
version: 4
description: DrCOM ePortal web auth 默认插件（按真实抓包对齐；不含默认 SSID，网络名请在 App 设置里配置）

# 认证时序
timing:
  ip_poll_ms: 250
  max_ip_wait_ms: 3000
  skip_network_ready_on_notify: true
  connect_timeout_ms: 3000      # 内网 Portal，连不上就别等 8 秒
  read_timeout_ms: 3000

# 通道策略
network:
  auth_over_wifi: true          # 认证/检测强制从 wlan0 出站（内网地址走蜂窝必超时）
  bind_process: true
  promote_network: true
  root_set_default: true
  preferred_ifaces: [wlan0, rmnet, eth0]

# 检测与重试
detect:
  retry_count: 3
  retry_delay_ms: 3000

# 全局请求头：check 与 login 共用，step 内同名声明可覆盖
headers:
  User-Agent: "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Mobile Safari/537.36 EdgA/157.0.0.0"
  Accept: "*/*"
  Accept-Language: "zh-CN,zh;q=0.9"
  Referer: "http://218.6.130.195:1333/"

sandbox:
  hosts:
    - 218.6.130.195:801
    - 218.6.130.195:1333

fields:
  - id: username
    name: 用户名
    type: text
    required: true
  - id: password
    name: 密码
    type: password
    required: true

check:
  method: GET
  url: "http://218.6.130.195:1333/drcom/chkstatus?callback=dr1002&jsVersion=4.X&v=3328&lang=zh"
  online_when:
    contains: '"result":1'
  offline_when:
    contains: '"result":0'

login:
  steps:
    - name: auth
      method: GET
      # 与抓包一致：user_account 不带 @运营商后缀；MAC 用当前 wlan0 真实值
      url: "http://218.6.130.195:801/eportal/portal/login?callback=dr1003&login_method=1&user_account=%2C1%2C${username}&user_password=${password}&wlan_user_ip=${ip}&wlan_user_ipv6=&wlan_user_mac=${mac}&wlan_ac_ip=218.89.190.11&wlan_ac_name=&jsVersion=4.1.3&terminal_type=2&lang=zh-cn&v=${rand}&lang=zh"
      headers:
        Referer: "http://218.6.130.195:1333/"
      success_when:
        json:
          path: result
          equals: "1"
      already_online_when:
        contains: "已经在线"
      fail:
        json_path: msg
