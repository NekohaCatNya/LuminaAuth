id: drcom-default
name: DrCOM 默认校园网认证
version: 2
description: DrCOM ePortal web auth 默认插件（不含默认 SSID，网络名请在 App 设置里配置）

# 认证时序（不写则用内置默认值）
timing:
  ip_poll_ms: 250                       # IP 就绪轮询步长（毫秒）
  max_ip_wait_ms: 3000                  # 等待 IP 就绪上限（毫秒）
  skip_network_ready_on_notify: true    # 通知检测模式触发时跳过“等待网络就绪”

# 通道与出口策略
network:
  bind_process: true                    # 认证成功后把本进程流量绑定到所选通道
  promote_network: true                 # 认证后请求系统对所选通道重评估（3 秒冷却，不循环）
  root_set_default: true                # 增强模式 + root：一次性把默认网络切到所选通道（无守护）
  preferred_ifaces: [wlan0, rmnet, eth0] # 优先网卡名，空则按传输类型挑

# 检测与重试
detect:
  retry_count: 3
  retry_delay_ms: 5000

sandbox:
  hosts:
    - 218.6.130.195:801
    - 218.6.130.195:1333

fields:
  - id: username
    name: 用户名
    type: text
    required: true
  - id: password
    name: 密码
    type: password
    required: true

isps:
  - id: after
    name: 教职工

check:
  method: GET
  url: "http://218.6.130.195:1333/drcom/chkstatus?callback=dr1002&jsVersion=4.X&v=3328&lang=zh"
  online_when:
    contains: '"result":1'
  offline_when:
    contains: '"result":0'

login:
  steps:
    - name: auth
      method: GET
      url: "http://218.6.130.195:801/eportal/portal/login?callback=dr1003&login_method=1&user_account=,1,${username}@${isp}&user_password=${password}&wlan_user_ip=${ip}&wlan_user_ipv6=&wlan_user_mac=000000000000&wlan_ac_ip=218.89.190.11&wlan_ac_name=&jsVersion=4.1.3&terminal_type=2&lang=zh-cn&v=${rand}&lang=zh"
      success_when:
        json:
          path: result
          equals: "1"
      already_online_when:
        contains: "已经在线"
      fail:
        json_path: msg
